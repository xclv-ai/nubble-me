 const ax=document.getElementById('lax');ax.innerHTML=D.map((d,i)=>`<span style="left:${xs(i*4)/W*100}%">${i===0?'7d':'|'}</span>`).join('')+`<span style="left:${(NOW/W*100)+7}%">now</span>`;
 const tr=document.getElementById('trend'),dots=[...document.querySelectorAll('#dots i')];
 let cur=0;function page(n){n=Math.max(0,Math.min(2,n));cur=n;tr.classList.toggle('on',n===1);tr.classList.toggle('left',n===2);dots.forEach((d,i)=>d.classList.toggle('on',i===n));document.getElementById('gildcap').classList.toggle('on',n===2);document.getElementById('dots').classList.toggle('light',n===2);if(window.__white)window.__white(n===2);try{window.webkit.messageHandlers.haptic.postMessage('tick')}catch(e){}}
 dots.forEach((d,i)=>d.onclick=()=>page(i));
 let x0=null,y0=null;
 addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)page(cur+(dx<0?1:-1))},{passive:true});
 window.__page=page;
 if(location.hash==='#trend')setTimeout(()=>page(1),300);
 if(location.hash==='#gold')setTimeout(()=>page(2),1200);
})();
