 g.strokeStyle=v<=WARM?YEL:WHT;g.lineWidth=maj?14:mid?7:3.2;g.lineCap='butt';g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);g.stroke()}

[0,20,40,60,80,100].forEach(n=>{const a=ang(n/100);g.fillStyle=n/100<=WARM?YEL:WHT;g.fillText(n,cx+Math.cos(a)*S*0.315,cy+Math.sin(a)*S*0.315)});
// yesterday: a small red mark outside the scale at 62
{const a=ang(0.62);g.fillStyle='#FF3B4E';g.save();g.translate(cx+Math.cos(a)*S*0.472,cy+Math.sin(a)*S*0.472);g.rotate(a+Math.PI/2);g.beginPath();g.moveTo(0,22);g.lineTo(-18,-14);g.lineTo(18,-14);g.closePath();g.fill();g.restore()}

const miniG=new THREE.Group();miniG.position.set(0.56,1.42,0);miniG.scale.setScalar(0.52);scene.add(miniG);
miniG.add(bezel.clone(),lip.clone());const miniGlass=glass.clone();miniG.add(miniGlass);const miniGlare=glare.clone();miniG.add(miniGlare);

{const r=mg.createRadialGradient(512,380,40,512,512,520);r.addColorStop(0,'#FBE27A');r.addColorStop(1,'#E9C640');mg.fillStyle=r;mg.fillRect(0,0,1024,1024);
 for(let i=0;i<70;i++){const a=(-90+i*360/70)*Math.PI/180,maj=i%5===0;mg.strokeStyle='#141100';mg.lineWidth=maj?7:3;const r1=maj?440:462;mg.beginPath();mg.moveTo(512+Math.cos(a)*r1,512+Math.sin(a)*r1);mg.lineTo(512+Math.cos(a)*496,512+Math.sin(a)*496);mg.stroke()}

 for(let d=0;d<14;d+=2){const a=(-90+d*360/14)*Math.PI/180;mg.fillText(d===0?'14':String(d),512+Math.cos(a)*352,512+Math.sin(a)*352)}

 mg.fillStyle='#F5D24A';mg.font='700 70px Geist';mg.fillText('21 OCT',512,622)}
const miniTex=new THREE.CanvasTexture(mc);miniTex.colorSpace=THREE.SRGBColorSpace;miniTex.anisotropy=R.capabilities.getMaxAnisotropy();
const miniFace=new THREE.Mesh(new THREE.CircleGeometry(0.70,128),new THREE.MeshPhysicalMaterial({map:miniTex,roughness:0.5,roughnessMap:grain}));miniFace.position.z=0.02;miniFace.receiveShadow=true;miniG.add(miniFace);

hand.castShadow=true;const handPivot=new THREE.Group();handPivot.position.z=0.07;handPivot.add(hand);miniG.add(handPivot);
const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.055,0.03,48),new THREE.MeshPhysicalMaterial({color:0xd9dce0,metalness:1,roughness:0.2}));cap.rotation.x=Math.PI/2;cap.position.z=0.09;cap.castShadow=true;miniG.add(cap);

const satin=new THREE.MeshPhysicalMaterial({color:0x0c0c0d,roughness:0.78,metalness:0,roughnessMap:grain});

const base=new THREE.Mesh(new THREE.ExtrudeGeometry(bs,{depth:0.03,bevelEnabled:true,bevelSize:0.02,bevelThickness:0.02,bevelSegments:6,curveSegments:24}),satin);base.position.z=-0.015;base.receiveShadow=true;con.add(base);

 piv.rotation.x=Math.PI/2-0.5;[sock,stem,tip].forEach(o=>{o.castShadow=true;o.userData.act='toggle';o.userData.key=t[0]});con.add(g);return {key:t[0],piv,on:true}});
// 4. rotary → range
const rot=new THREE.Group();rot.position.set(0,-0.1,0.035);con.add(rot);
const rotRing=new THREE.Mesh(new THREE.LatheGeometry([[0.2,0],[0.25,0],[0.255,0.03],[0.235,0.05],[0.205,0.05]].map(p=>new THREE.Vector2(p[0],p[1])),120),alu);rotRing.rotation.x=Math.PI/2;rot.add(rotRing);
const rotWell=new THREE.Mesh(new THREE.CircleGeometry(0.205,64),new THREE.MeshPhysicalMaterial({color:0x6a6c70,metalness:0.85,roughness:0.42,roughnessMap:brushed,envMapIntensity:2.5}));rotWell.position.z=0.01;rot.add(rotWell);
const knob=new THREE.Group();knob.position.z=0.01;rot.add(knob);
const bar=new THREE.Mesh(new RoundedBoxGeometry(0.19,0.47,0.15,8,0.07),alu);bar.position.z=0.075;bar.castShadow=true;knob.add(bar);
const slot=new THREE.Mesh(new RoundedBoxGeometry(0.034,0.26,0.02,3,0.012),new THREE.MeshBasicMaterial({color:0x050505}));slot.position.z=0.151;knob.add(slot);
[rotRing,rotWell,bar,slot].forEach(o=>o.userData.act='range');
const RANGES=[['TODAY',1.0,0],['WEEK',0.92,-0.75],['MONTH',0.75,-1.5]];let rangeIdx=0,knobAng=0;
// 5. pills → mute / share
function pill(x,act){const m=new THREE.Mesh(new THREE.CapsuleGeometry(0.038,0.17,8,24),gloss);m.position.set(x,-0.13,0.05);m.scale.z=0.55;m.castShadow=true;m.userData.act=act;con.add(m);return m}
const pillL=pill(-0.86,'mute'),pillR=pill(0.86,'share');
// the gauge reads what the console says: share of each feed × range
const FEED={rivals:0.30,models:0.12,money:0.08,buyers:0.06},BASE=0.18;
function recompute(){let t=BASE;toggles.forEach(g=>{if(g.on)t+=FEED[g.key]});window.__setTarget(Math.min(1,t*RANGES[rangeIdx][1]))}
let muted=false,flash={};
addEventListener('pointerdown',e=>{ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,cam);
 const hit=ray.intersectObjects(con.children,true)[0];if(!hit)return;let o=hit.object;while(o&&!o.userData.act)o=o.parent;if(!o)return;const act=o.userData.act;
 if(act==='toggle'){const g=toggles.find(t=>t.key===o.userData.key);g.on=!g.on;haptic('tick');recompute()}
 if(act==='range'){rangeIdx=(rangeIdx+1)%3;redrawRange(RANGES[rangeIdx][0]);haptic('press');recompute()}
 if(act==='sos'){haptic('land');flash.sos=performance.now();document.getElementById('read-s1').textContent='CODE RED · Profound raised $155M'}
 if(act==='scan'||act==='watch'){haptic('press');flash[act]=performance.now()}
 if(act==='mute'){muted=!muted;drawSos(muted);haptic('tick');flash.mute=performance.now()}
 if(act==='share'){haptic('press');flash.share=performance.now()}});
window.__consoleTick=now=>{
 toggles.forEach(g=>{const tgt=g.on?Math.PI/2-0.5:Math.PI/2+0.5;g.piv.rotation.x+=(tgt-g.piv.rotation.x)*0.3});
 knobAng+=(RANGES[rangeIdx][2]-knobAng)*0.18;knob.rotation.z=knobAng;
 const pulse=muted?0.6:0.75+0.25*Math.sin(now/260);sosText.material.color.setScalar(flash.sos&&now-flash.sos<400?1.6:pulse);
 [['scan',lensL],['watch',lensR]].forEach(([k,l])=>{const d=flash[k]?now-flash[k]:9999;l.userData.mat.emissiveIntensity=d<600?0.9*(1-d/600):0});
 [['mute',pillL],['share',pillR]].forEach(([k,m])=>{const d=flash[k]?now-flash[k]:9999;m.position.z=0.05-(d<180?0.012:0)});
};

window.__setTarget=t=>{upFrom=val;target=t;start=performance.now()-250;landed=false;phase='up';lastDecade=Math.floor(val*10)};
const sweep=p=>{const c1=1.70158*1.15,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}; // ease out with a small overshoot

// gyroscope: the camera moves, the light stays — reflections and the needle shadow slide
let tx=0,ty=0,gx=0,gy=0;
window.__tilt=(x,y)=>{tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y))};
addEventListener('deviceorientation',e=>{tx=THREE.MathUtils.clamp((e.gamma||0)/30,-1,1);ty=THREE.MathUtils.clamp(((e.beta||50)-50)/30,-1,1)});
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
addEventListener('click',()=>{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})},{once:true});
function fit(){cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<0.7?11:7.5;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}fit();addEventListener('resize',fit);
const clk=new THREE.Clock();
(function tick(){const dt=Math.min(clk.getDelta(),0.033);
 gx+=(tx-gx)*0.08;gy+=(ty-gy)*0.08;
 cam.position.set(0,0,cam.aspect<0.7?26:18);cam.lookAt(0,0,0);
 if(!window.__rig){window.__rig=new THREE.Group();window.__rig.add(panel,mainG,miniG);scene.add(window.__rig)}
 window.__rig.rotation.set(-gy*0.04,gx*0.04,0);
 scene.environmentRotation.set(-gy*0.22,gx*0.3,0);
 key.position.set(-1.2+gx*0.5,2.4-gy*0.5,3.2);
 glareTex.offset.set(0.25-gx*0.12,0.25+gy*0.12);
 const now=performance.now();let p=0;
 if(phase==='down'){const q=Math.min(1,(now-downStart)/(120+380*from));val=from*(1-q*q);if(q>=1){phase='up';start=now-250;lastDecade=0;val=0;upFrom=0}}
 else{p=Math.min(1,Math.max(0,(now-start-250)/1600));val=upFrom+(target-upFrom)*sweep(p)}
 const n=Math.max(0,Math.min(100,Math.round(val*100)));const dec=Math.floor(n/10);
 if(phase==='up'&&dec>lastDecade){lastDecade=dec;haptic('tick')}
 if(phase==='up'&&p>=1&&!landed){landed=true;haptic('land');drawNum(Math.round(target*100),true)}else if(!landed)drawNum(n,false);
 pivot.rotation.z=(-250-220*val)*Math.PI/180;
 if(window.__mini)window.__mini(performance.now());
 if(window.__consoleTick)window.__consoleTick(performance.now());
 R.render(scene,cam);requestAnimationFrame(tick)})();
window.__ready=true;
(function clock(){const d=new Date();document.getElementById('rt').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});document.getElementById('rd').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'}).toUpperCase();setTimeout(clock,15000)})();
