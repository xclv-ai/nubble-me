   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #222c2c" x="36.864" y="34.308837" transform="rotate(-0 36.864 34.308837)">2   From evidence to a conditional next step</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52605e" x="36.864" y="60.571494" transform="rotate(-0 36.864 60.571494)">Keep source facts, reader context, assumptions, inferences and proposed actions separately inspectable.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52605e" x="36.864" y="566.820419" transform="rotate(-0 36.864 566.820419)">Proposed framework — no performance results</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #52605e" x="884.736" y="566.268544" transform="rotate(-0 884.736 566.268544)">NUBBLE METHOD  /  CONCEPTUAL</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #185d58" x="60.8256" y="136.28085" transform="rotate(-0 60.8256 136.28085)">SOURCE FACTS</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222c2c" x="60.8256" y="170.627" transform="rotate(-0 60.8256 170.627)">Source-supported facts</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(60.8256 200.729205)">Claim → exact source span</text>
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(60.8256 218.618694)">Provenance, scope and date</text>
    <text style="font-size: 14.5px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(60.8256 236.508182)">Omissions remain unknown</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #185d58" x="60.8256" y="302.49285" transform="rotate(-0 60.8256 302.49285)">EXPLICIT READER CONTEXT</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(60.8256 331.494561)">Goal and current plan</text>
    <text style="font-size: 14.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(60.8256 349.630801)">Constraints and horizon</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36c14" x="361.2672" y="136.28085" transform="rotate(-0 361.2672 136.28085)">CONDITIONAL INFERENCE</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222c2c" x="361.2672" y="172.586131" transform="rotate(-0 361.2672 172.586131)">What might follow</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14.4px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(361.2672 188.890875)">If facts and context hold,</text>
    <text style="font-size: 14.4px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(361.2672 206.656987)">this consequence may follow.</text>
    <text style="font-size: 14.4px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(361.2672 224.4231)">State the reasoning and</text>
    <text style="font-size: 14.4px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(361.2672 242.189212)">what would change the</text>
    <text style="font-size: 14.4px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(361.2672 259.955325)">conclusion.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36c14" x="361.2672" y="289.938387" transform="rotate(-0 361.2672 289.938387)">Inference ≠ source fact.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #92534e" x="361.2672" y="349.038475" transform="rotate(-0 361.2672 349.038475)">ASSUMPTIONS</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #92534e" x="361.2672" y="366.810412" transform="rotate(-0 361.2672 366.810412)">Explicit and testable</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222c2c" x="661.7088" y="136.28085" transform="rotate(-0 661.7088 136.28085)">PROPOSED ACTION</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222c2c" x="661.7088" y="172.652537" transform="rotate(-0 661.7088 172.652537)">A feasible next step</text>
   </g>
   <g id="text_18">
    <text style="font-size: 14.3px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(661.7088 199.097801)">Who could do what?</text>
    <text style="font-size: 14.3px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(661.7088 216.740538)">When? Under what condition?</text>
    <text style="font-size: 14.3px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(661.7088 234.383275)">Link to evidence and</text>
    <text style="font-size: 14.3px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(661.7088 252.026011)">the reader’s constraints.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52605e" x="661.7088" y="289.938387" transform="rotate(-0 661.7088 289.938387)">Reader retains the decision.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #185d58" x="465.408" y="98.234881" transform="rotate(-0 465.408 98.234881)">Evidence links remain available throughout</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52605e" x="43.3152" y="411.413281" transform="rotate(-0 43.3152 411.413281)">POSSIBLE DECISION STATUSES</text>
   </g>
   <g id="text_22">
    <text style="font-size: 12.3px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #52605e" x="878.2848" y="411.634031" transform="rotate(-0 878.2848 411.634031)">Select by support, feasibility and risk</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 15.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #185d58" x="54.3744" y="458.50705" transform="rotate(-0 54.3744 458.50705)">Act</text>
   </g>
   <g id="text_24">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(54.3744 491.390044)">Take a supported</text>
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(54.3744 507.058768)">next step.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 15.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #185d58" x="224.8704" y="458.447675" transform="rotate(-0 224.8704 458.447675)">Verify</text>
   </g>
   <g id="text_26">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(224.8704 491.390044)">Resolve a material</text>
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(224.8704 507.058768)">unknown first.</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 15.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #185d58" x="395.3664" y="458.50705" transform="rotate(-0 395.3664 458.50705)">Monitor</text>
   </g>
   <g id="text_28">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(395.3664 491.390044)">Watch a stated</text>
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(395.3664 507.058768)">trigger or horizon.</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 15.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b36c14" x="565.8624" y="458.50705" transform="rotate(-0 565.8624 458.50705)">Maintain plan</text>
   </g>
   <g id="text_30">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(565.8624 491.390044)">Supported inaction:</text>
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(565.8624 507.058768)">no change warranted.</text>
   </g>
   <g id="text_31">
    <text style="font-weight: 700; font-size: 15.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #92534e" x="736.3584" y="458.50705" transform="rotate(-0 736.3584 458.50705)">Abstain</text>
   </g>
   <g id="text_32">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(736.3584 491.390044)">Insufficient evidence</text>
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; fill: #222c2c" transform="translate(736.3584 507.058768)">or unresolved risk.</text>
   </g>
  </g>
 </g>
