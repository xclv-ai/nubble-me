<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Luce check</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0a; color: #e8e8e8; font: 16px/1.45 -apple-system, system-ui, sans-serif; padding: 20px max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: #a8a8a8; font-size: 15px; }
  section { margin: 0 0 34px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 760px) { .pair { grid-template-columns: 1fr 1fr; } }
  figure { margin: 0; background: #000; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
  figcaption { font-size: 13px; padding: 8px 12px; color: #bbb; }
  figcaption b { color: #8fd19e; font-weight: 600; }
  figcaption i { color: #E9D27A; font-style: normal; font-weight: 600; }
  img { display: block; width: 100%; height: auto; }
  a.live { display: block; text-align: center; padding: 14px; border-radius: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <h1>Luce controls: reference vs Nubble</h1>
  <p>Top: your Ferrari Luce reference. Below: the same control as it renders on the Nubble page today.</p>

  <section>
    <h2>Depth key</h2>
    <div class="pair">
      <figure><img src="key-luce.jpg" alt="Luce reference rotary key"><figcaption><b>Luce reference</b></figcaption></figure>
      <figure><img src="key-nubble.jpg" alt="Nubble depth key, live 3D render"><figcaption><i>Nubble, live 3D</i></figcaption></figure>
    </div>
  </section>

  <section>
    <h2>Rival levers</h2>
    <div class="pair">
      <figure><img src="lever-luce.jpg" alt="Luce reference toggle"><figcaption><b>Luce reference</b> (the toggle on the right)</figcaption></figure>
      <figure><img src="lever-nubble.jpg" alt="Nubble rival levers, live 3D render"><figcaption><i>Nubble, live 3D</i></figcaption></figure>
    </div>
  </section>

  <a class="live" href="/founders-v10">Touch them live on the page</a>
</body>
</html>
