name: Nubble
options:
  bundleIdPrefix: me.nubble
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: 3

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  Nubble:
    type: application
    platform: iOS
    sources:
      - path: Nubble
      - path: ProtoBundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
      - target: NubbleShare
      - target: NubbleWidget
    entitlements:
      path: Nubble/Nubble.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.nubble.app
    info:
      path: Nubble/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Debug viewer loads prototypes from your Mac on the home network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Satoshi-Light.otf
          - Satoshi-Regular.otf
          - Satoshi-Medium.otf
          - Satoshi-Bold.otf
          - Zodiak-Regular.otf
          - Zodiak-Bold.otf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - JetBrainsMono-Light.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
          - Geist-Variable.ttf
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Nubble
        NSRemindersFullAccessUsageDescription: Dr HAOS puts each prescription you accept on a "Dr HAOS ℞" list in Reminders.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - me.nubble.feed.refresh
          - me.nubble.article.process
        CFBundleDocumentTypes:
          - CFBundleTypeName: ePub Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Plain Text
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: JSON Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
          - CFBundleTypeName: Markdown Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.nubble.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: true
        DEVELOPMENT_TEAM: F7TR367W75
        CODE_SIGN_STYLE: Automatic

  NubbleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NubbleShare
    entitlements:
      path: NubbleShare/NubbleShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.nubble.app
    info:
      path: NubbleShare/Info.plist
      properties:
        CFBundleDisplayName: Nubble
        NSRemindersFullAccessUsageDescription: Dr HAOS puts each prescription you accept on a "Dr HAOS ℞" list in Reminders.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.nubble.app.share
        DEVELOPMENT_TEAM: F7TR367W75
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete

  NubbleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NubbleWidget
      - path: Nubble/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: NubbleWidget/NubbleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.nubble.app
    info:
      path: NubbleWidget/Info.plist
      properties:
        CFBundleDisplayName: Dr HAOS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.nubble.app.widget
        DEVELOPMENT_TEAM: F7TR367W75
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
